name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xxx-core-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xxx-core-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build ThroneCore
        uses: ./.github/actions/throne-core
      - name: Inspect ThroneCore Java API
        shell: bash
        run: |
          set -euo pipefail
          unzip -p app/libs/ThroneCore.aar classes.jar > /tmp/throne-classes.jar
          classes="$(jar tf /tmp/throne-classes.jar | grep '^io/throneproj/.*\.class$' | grep -v '\$' || true)"
          if [ -z "$classes" ]; then
            echo "Aucune classe io.throneproj trouvée"
            exit 1
          fi
          while IFS= read -r entry; do
            class="${entry%.class}"
            class="${class//\//.}"
            echo "===== $class ====="
            javap -classpath /tmp/throne-classes.jar -public "$class" || true
          done <<< "$classes"
  
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XXX-CORE-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
