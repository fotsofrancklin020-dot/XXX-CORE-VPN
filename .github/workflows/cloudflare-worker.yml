
name: Cloudflare Worker Deploy

on:
  push:
    branches:
      - main
      - cloudflare-x-ui-panel
  workflow_dispatch:

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

  deploy:
    name: Deploy XXX-CORE-VPN Worker
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy XXX-CORE-VPN Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
