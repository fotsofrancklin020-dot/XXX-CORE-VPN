name: XXX-CORE-VPN - Sauvegarde D1

on:
  push:
    branches:
      - cloudflare-x-ui-panel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Exporter la base Cloudflare D1
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exporter la base D1
        run: >
          npx --yes wrangler@4 d1 export xxxcore-database
          --remote
          --output=./xxxcore-database-backup.sql
          --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conserver la sauvegarde
        uses: actions/upload-artifact@v4
        with:
          name: XXX-CORE-VPN-D1-Backup
          path: xxxcore-database-backup.sql
          retention-days: 7
          if-no-files-found: error
